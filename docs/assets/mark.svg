<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150">
  <!-- The manyhouses mark: a house outline whose wall turns into a key, redrawn from images/many_houses_logo.jpeg. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2CC5B"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#C99B38"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#gold)" stroke-linejoin="miter" stroke-linecap="butt">
    <!-- outer roof -->
    <path d="M3,46 L50,6 L97,46" stroke-width="8"/>
    <!-- chimney -->
    <path d="M74,9 H83 V25 L74,17 Z" fill="url(#gold)" stroke="none"/>
    <!-- outer wall, open at the bottom right -->
    <path d="M14,40 V82 H46" stroke-width="7.5"/>
    <!-- inner house that becomes the key's stem -->
    <path d="M28,71 V39 L50,19 L71,39 V63 L57,76 V93" stroke-width="7.5"/>
    <!-- key bow -->
    <circle cx="57" cy="104" r="11" stroke-width="7"/>
    <!-- key blade and teeth -->
    <path d="M57,115 V144 L67,135" stroke-width="7"/>
    <path d="M57,124 H65 M57,132 H63" stroke-width="5"/>
  </g>
</svg>
